name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The provider-free integration suites drive a real `pi` process. They are not part of
  # `check` because they need pi on PATH; `npm run` would otherwise shadow it with the
  # devDependency's bundled CLI (see test/integration/pi-cli.ts).
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent@latest
      - name: Integration suites
        run: npm run test:integration
